services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: support_ecommerce
      MYSQL_USER: support_app
      MYSQL_PASSWORD: support_app_pw
    ports:
      - "3306:3306"
    volumes:
      - ./db/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pw"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Free, self-contained Oracle Express Edition image. APP_USER/APP_USER_PASSWORD
  # make the image create that schema automatically in the XEPDB1 pluggable
  # database before running our init scripts, so 01/02/03_*.sql can connect
  # as support_app directly (matching ORACLE_USER/ORACLE_PASSWORD in .env).
  oracle:
    image: gvenzl/oracle-xe:21-slim
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: root_pw
      APP_USER: support_app
      APP_USER_PASSWORD: support_app_pw
    ports:
      - "1521:1521"
    volumes:
      - ./db/oracle/init:/container-entrypoint-initdb.d:ro
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.11.3
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: hashing
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: support_app
      MYSQL_PASSWORD: support_app_pw
      MYSQL_DATABASE: support_ecommerce
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: supportgraph
      ORACLE_HOST: oracle
      ORACLE_PORT: "1521"
      ORACLE_SERVICE: XEPDB1
      ORACLE_USER: support_app
      ORACLE_PASSWORD: support_app_pw
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: support_policies
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      oracle:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  mysql_data:
  mongo_data:
  oracle_data:
  qdrant_data:
